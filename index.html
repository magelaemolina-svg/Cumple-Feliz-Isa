<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sorpresa</title><style>
:root{--bg:#0b0a0d;--ink:#f7f2f7;--gold:#d4aa56;--vio:#9a5fc0}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
.slide{position:absolute;inset:0;padding:24px 18px 34px;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;transform:scale(1.02);pointer-events:none;transition:opacity .45s ease,transform .45s ease}
.slide.active{opacity:1;transform:none;pointer-events:auto}h1,h2,p{text-align:center;margin:8px 0}h1{font-size:clamp(38px,10vw,72px);line-height:1}h2{font-size:clamp(25px,7vw,48px)}p{font-size:clamp(18px,5vw,27px);line-height:1.25}.gold{color:var(--gold)}.vio{color:#c793e6}
.photo{width:min(91vw,650px);max-height:72vh;object-fit:contain;border:8px solid #eee8dc;box-shadow:0 18px 55px #0009}
button{border:2px solid var(--vio);background:transparent;color:white;border-radius:999px;padding:15px 22px;font-size:16px;font-weight:800;margin-top:20px}.kicker{color:var(--gold);letter-spacing:.12em;font-weight:800;font-size:13px;text-transform:uppercase;margin-bottom:10px}.progress{position:fixed;bottom:0;left:0;height:4px;background:var(--gold);width:0;z-index:5}.final{border:1px solid #3a2c43;border-radius:22px;padding:30px 22px;background:#121015;box-shadow:0 20px 60px #0008;max-width:680px}.volume{font-size:clamp(42px,12vw,78px)}
</style></head><body><div id="progress" class="progress"></div>
<section class="slide active"><div class="kicker">Antes de empezar…</div><h1 class="volume">🔊 SUBÍ<br><span class="gold">EL VOLUMEN</span></h1><button onclick="startShow()">😈 TOCÁ PARA EMPEZAR</button></section>
<section class="slide"><img class="photo" src="foto1.jpg"></section>
<section class="slide"><img class="photo" src="foto2.jpg"></section>
<section class="slide"><img class="photo" src="foto8.jpg"></section>
<section class="slide"><img class="photo" src="foto3.jpg"></section>
<section class="slide"><img class="photo" src="foto9.jpg"></section>
<section class="slide"><img class="photo" src="foto4.jpg"></section>
<section class="slide"><img class="photo" src="foto10.jpg"></section>
<section class="slide"><img class="photo" src="foto5.jpg"></section>
<section class="slide"><img class="photo" src="foto11.jpg"></section>
<section class="slide"><img class="photo" src="foto12.jpg"></section>
<section class="slide"><img class="photo" src="foto6.jpg"></section>
<section class="slide"><img class="photo" src="foto13.jpg"></section>
<section class="slide"><img class="photo" src="foto14.jpg"></section>
<section class="slide"><img class="photo" src="foto7.jpg"></section>
<section class="slide"><img class="photo" src="foto15.jpg"></section>
<section class="slide"><img class="photo" src="foto16.jpg"></section>
<section class="slide"><img class="photo" src="foto17.jpg"></section>
<section class="slide"><h1 class="gold">¡DIVERTIRNOS!! 🤘</h1><p>Y para eso… tenemos un plan.</p></section>
<section class="slide"><div class="final"><div class="kicker">11 · 12 · 2026</div><h1>🔥 LA FIESTA<br><span class="gold">DE LA X</span> 🔥</h1><h2>Y sí…<br><span class="vio">vos venís.</span> 😈</h2><p>🎟️ Tu entrada está a salvo.</p></div><button onclick="restart()">VER DE NUEVO ↺</button></section>
<audio id="music" src="musica-instrumental.mp3" preload="auto"></audio>
<script>
const slides=[...document.querySelectorAll('.slide')];const music=document.getElementById('music');let i=0,timers=[];
function show(n){slides[i].classList.remove('active');i=n;slides[i].classList.add('active');document.getElementById('progress').style.width=(i/(slides.length-1)*100)+'%'}
function startShow(){music.currentTime=0;music.play().catch(()=>{});show(1);const partyIndex=slides.length-1;const preParty=partyIndex-1;const slots=preParty-1;const step=23500/slots;for(let n=2;n<=preParty;n++){timers.push(setTimeout(()=>show(n),Math.round((n-1)*step)));}timers.push(setTimeout(()=>show(partyIndex),25000));}
function restart(){timers.forEach(clearTimeout);timers=[];music.pause();music.currentTime=0;show(0)}
</script></body></html>
